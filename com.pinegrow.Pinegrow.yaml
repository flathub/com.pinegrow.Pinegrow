app-id: com.pinegrow.Pinegrow
runtime: org.freedesktop.Sdk
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
command: pinegrow
separate-locales: false
finish-args:
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --filesystem=home
  - --share=ipc
modules:
  - name: pinegrow
    buildsystem: simple
    build-commands:
      - install -D apply_extra /app/bin/apply_extra
      - install -D pinegrow /app/bin/pinegrow
      - install -Dm644 -t /app/share/metainfo com.pinegrow.Pinegrow.appdata.xml
      - install -Dm644 -t /app/share/applications com.pinegrow.Pinegrow.desktop
      - install -Dm644 -t /app/share/icons/hicolor/scalable/apps com.pinegrow.Pinegrow.svg
    sources:
      - type: extra-data
        only-arches:
          - x86_64
        url: https://github.com/Pinegrow/PinegrowReleases/releases/download/pg9.3/PinegrowLinux64.9.3.zip
        sha256: d3104145c8f0b1c5bc6d65a685e8ca64fc71b438ec314d2314a098ebbab18328
        size: 321942990
        filename: Pinegrow.zip
      - type: file
        path: com.pinegrow.Pinegrow.appdata.xml
      - type: file
        path: com.pinegrow.Pinegrow.desktop
      - type: file
        path: com.pinegrow.Pinegrow.svg
      - type: script
        dest-filename: apply_extra
        commands:
          - set -e
          - unzip Pinegrow.zip > /dev/null
          - rm -f Pinegrow.zip
      - type: script
        dest-filename: pinegrow
        commands:
          - exec /app/extra/PinegrowLibrary --enable-features=UseOzonePlatform --ozone-platform-hint=auto --enable-chrome-browser-cloud-management
            "$@"
